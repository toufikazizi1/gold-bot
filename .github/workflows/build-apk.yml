name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test bridge
        run: |
          cd bridge
          python3 test_bridge.py

      - name: Install
        run: npm install

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gold-bot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gold-bot-apk
          path: gold-bot.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: بوت الذهب (آخر نسخة)
          body: نزّل gold-bot.apk وثبّته على أندرويد.
          files: gold-bot.apk
          make_latest: true
